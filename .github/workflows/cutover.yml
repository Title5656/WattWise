name: Production data cutover

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wattwise-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    name: Backup, migrate, backfill, and verify production D1
    if: vars.MULTI_USER_CUTOVER_COMPLETE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production release
        run: npm run build

      - name: Configure production D1 binding
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID"
          jq --arg id "$D1_DATABASE_ID" \
            '.name = "wattwise" | .d1_databases[0].database_id = $id | .d1_databases[0].migrations_dir = "../../drizzle"' \
            dist/server/wrangler.json > "$RUNNER_TEMP/wrangler.json"
          mv "$RUNNER_TEMP/wrangler.json" dist/server/wrangler.json

      - name: Export pre-cutover D1 backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 export DB --remote --output "$RUNNER_TEMP/wattwise-pre-cutover.sql" --config dist/server/wrangler.json

      - name: Retain backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: wattwise-pre-cutover-${{ github.run_id }}
          path: ${{ runner.temp }}/wattwise-pre-cutover.sql
          if-no-files-found: error
          retention-days: 3

      - name: Record legacy row counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler d1 execute DB --remote --config dist/server/wrangler.json --command
          "SELECT 'households' AS table_name, COUNT(*) AS row_count FROM households
          UNION ALL SELECT 'household_appliances', COUNT(*) FROM household_appliances
          UNION ALL SELECT 'saved_home_appliances', COUNT(*) FROM saved_home_appliances
          UNION ALL SELECT 'monthly_energy_records', COUNT(*) FROM monthly_energy_records"

      - name: Apply production migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: npm run cutover:migrate

      - name: Preview legacy cutover
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: npm run cutover:remote -- preview

      - name: Backfill quarantine households
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: npm run cutover:remote -- backfill

      - name: Verify cutover
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: npm run cutover:remote -- verify
