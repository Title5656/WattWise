name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: wattwise-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error

  deploy:
    name: Deploy main to WattWise Workers
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.MULTI_USER_CUTOVER_COMPLETE == 'true'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download validated production build
        uses: actions/download-artifact@v8
        with:
          name: wattwise-dist-${{ github.sha }}
          path: dist

      - name: Configure production bindings
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${{ vars.CLOUDFLARE_ACCESS_TEAM_DOMAIN }}
          CLOUDFLARE_ACCESS_AUD: ${{ vars.CLOUDFLARE_ACCESS_AUD }}
        run: |
          test -n "$D1_DATABASE_ID"
          test -n "$CLOUDFLARE_ACCESS_TEAM_DOMAIN"
          test -n "$CLOUDFLARE_ACCESS_AUD"
          jq --arg id "$D1_DATABASE_ID" --arg team "$CLOUDFLARE_ACCESS_TEAM_DOMAIN" --arg aud "$CLOUDFLARE_ACCESS_AUD" \
            '.name = "wattwise" | .d1_databases[0].database_id = $id | .d1_databases[0].migrations_dir = "../../drizzle" | .vars = ((.vars // {}) + {CLOUDFLARE_ACCESS_TEAM_DOMAIN: $team, CLOUDFLARE_ACCESS_AUD: $aud})' \
            dist/server/wrangler.json > "$RUNNER_TEMP/wrangler.json"
          mv "$RUNNER_TEMP/wrangler.json" dist/server/wrangler.json

      - name: Reconcile existing D1 migration history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute DB --remote --file scripts/d1-baseline.sql --config dist/server/wrangler.json

      - name: Apply pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations list DB --remote --config dist/server/wrangler.json
          npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json

      - name: Verify cutover is still current
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: npm run cutover:remote -- verify

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Smoke-test credentialed production bootstrap
        env:
          PRODUCTION_URL: https://wattwise.title5656.workers.dev
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          access_headers=(
            -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID"
            -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET"
          )

          html_headers="$RUNNER_TEMP/wattwise-html-headers.txt"
          html_body="$RUNNER_TEMP/wattwise.html"
          access_cookies="$RUNNER_TEMP/wattwise-access-cookies.txt"
          html_http_code="$(curl --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${access_headers[@]}" \
            --cookie-jar "$access_cookies" \
            --dump-header "$html_headers" \
            --output "$html_body" \
            --write-out "%{http_code}" \
            "$PRODUCTION_URL/")"

          if [[ "$html_http_code" != 200 ]]; then
            echo "::error::Authenticated HTML returned HTTP $html_http_code"
            exit 1
          fi
          if ! grep -Eiq '^content-type: *text/html' "$html_headers"; then
            html_content_type="$(grep -Ei '^content-type:' "$html_headers" | tail -n 1 | tr -d '\r' || true)"
            echo "::error::Authenticated response is not HTML ($html_content_type)"
            exit 1
          fi

          bootstrap_tag="$(grep -Eio '<script[^>]*>' "$html_body" \
            | grep -Ei 'type="module"' \
            | grep -Ei 'src="[^"]+"' \
            | grep -Ei 'crossorigin="use-credentials"' \
            | sed -n '1p' || true)"
          if [[ -z "$bootstrap_tag" ]]; then
            echo "::error::Authenticated HTML has no credentialed module bootstrap script"
            grep -Eio '<script[^>]*>' "$html_body" \
              | grep -Ei 'type="module"' \
              | sed -n '1,5p' || true
            exit 1
          fi

          bootstrap_path="$(printf '%s' "$bootstrap_tag" | sed -E 's/.*src="([^"]+)".*/\1/')"
          case "$bootstrap_path" in
            /*) ;;
            *) echo "Unexpected bootstrap asset path: $bootstrap_path" >&2; exit 1 ;;
          esac

          bootstrap_headers="$RUNNER_TEMP/wattwise-bootstrap-headers.txt"
          bootstrap_http_code="$(curl --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "${access_headers[@]}" \
            --cookie "$access_cookies" \
            --dump-header "$bootstrap_headers" \
            --output "$RUNNER_TEMP/wattwise-bootstrap.js" \
            --write-out "%{http_code}" \
            "$PRODUCTION_URL$bootstrap_path")"

          if [[ "$bootstrap_http_code" != 200 ]]; then
            echo "::error::Bootstrap asset returned HTTP $bootstrap_http_code"
            exit 1
          fi
          if ! grep -Eiq '^content-type:.*javascript' "$bootstrap_headers"; then
            bootstrap_content_type="$(grep -Ei '^content-type:' "$bootstrap_headers" | tail -n 1 | tr -d '\r' || true)"
            echo "::error::Bootstrap asset is not JavaScript ($bootstrap_content_type)"
            exit 1
          fi

      - name: Smoke-test production catalog API
        env:
          PRODUCTION_URL: https://wattwise.title5656.workers.dev
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          response="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" \
            "$PRODUCTION_URL/api/catalog?pageSize=1")"
          echo "$response" | jq -e 'has("items") and has("pagination") and (.items | length <= 1)'

      - name: Smoke-test an isolated production Home mutation
        env:
          PRODUCTION_URL: https://wattwise.title5656.workers.dev
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fixture_name="WattWise CI Home mutation fixture"
          if [[ ! "$CLOUDFLARE_ACCESS_CLIENT_ID" =~ ^[A-Za-z0-9.-]{1,200}$ ]]; then
            echo "Cloudflare Access client ID has an unsafe format" >&2
            exit 1
          fi
          access_headers=(
            -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID"
            -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET"
          )
          cleanup() {
            cleanup_sql="DELETE FROM households
              WHERE name = 'WattWise CI Home mutation fixture'
                AND id IN (
                  SELECT hm.household_id
                  FROM household_members AS hm
                  JOIN user_identities AS ui ON ui.user_id = hm.user_id
                  WHERE hm.role = 'owner'
                    AND ui.provider = 'cloudflare-access'
                    AND ui.subject = 'service-token:$CLOUDFLARE_ACCESS_CLIENT_ID'
                )"
            cleaned=false
            for attempt in 1 2 3; do
              if npx wrangler d1 execute DB --remote --command "$cleanup_sql" --config dist/server/wrangler.json; then
                cleaned=true
                break
              fi
              sleep $((attempt * 2))
            done
            test "$cleaned" = true

            verification="$(npx wrangler d1 execute DB --remote --json \
              --command "SELECT COUNT(*) AS fixture_count
                FROM households AS h
                WHERE h.name = 'WattWise CI Home mutation fixture'
                  AND EXISTS (
                    SELECT 1
                    FROM household_members AS hm
                    JOIN user_identities AS ui ON ui.user_id = hm.user_id
                    WHERE hm.household_id = h.id
                      AND hm.role = 'owner'
                      AND ui.provider = 'cloudflare-access'
                      AND ui.subject = 'service-token:$CLOUDFLARE_ACCESS_CLIENT_ID'
                  )" \
              --config dist/server/wrangler.json)"
            echo "$verification" | jq -e '[.. | objects | .fixture_count? // empty] | last == 0'
          }
          cleanup
          trap 'cleanup || true' EXIT

          catalog="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            "${access_headers[@]}" \
            "$PRODUCTION_URL/api/catalog?category=fan&pageSize=1")"
          model_id="$(echo "$catalog" | jq -er '.items[0].id')"
          household="$(curl --fail --silent --show-error --request POST \
            "${access_headers[@]}" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg name "$fixture_name" '{name: $name}')" \
            "$PRODUCTION_URL/api/households")"
          household_id="$(echo "$household" | jq -er '.household.id')"
          snapshot="$(jq -nc --arg id "$model_id" '{
            expectedRevision: 0,
            items: [range(0; 7) as $position | {
              id: $id,
              instanceId: ("ci-smoke-" + ($position | tostring)),
              quantity: 1,
              hoursPerDay: 4,
              cyclesPerMonth: null,
              usageSchedule: {
                kind: "hours",
                hoursByPeriod: {night: 0, morning: 1, daytime: 1, evening: 2}
              }
            }]
          }')"
          saved="$(curl --fail --silent --show-error --request PUT \
            "${access_headers[@]}" \
            -H "Content-Type: application/json" \
            --data "$snapshot" \
            "$PRODUCTION_URL/api/households/$household_id/home")"
          echo "$saved" | jq -e --arg id "$model_id" '
            .revision == 1
              and (.items | length == 7)
              and ([.items[].instanceId] == [range(0; 7) | "ci-smoke-\(.)"])
              and all(.items[];
                .id == $id
                  and .quantity == 1
                  and .hoursPerDay == 4
                  and .cyclesPerMonth == null
                  and .usageSchedule.kind == "hours"
                  and .usageSchedule.hoursByPeriod == {night: 0, morning: 1, daytime: 1, evening: 2}
              )'

          confirmed="$(curl --fail --silent --show-error \
            "${access_headers[@]}" \
            "$PRODUCTION_URL/api/households/$household_id/home")"
          echo "$confirmed" | jq -e --arg id "$model_id" '
            .revision == 1
              and (.items | length == 7)
              and ([.items[].instanceId] == [range(0; 7) | "ci-smoke-\(.)"])
              and all(.items[];
                .id == $id
                  and .quantity == 1
                  and .hoursPerDay == 4
                  and .cyclesPerMonth == null
                  and .usageSchedule.kind == "hours"
                  and .usageSchedule.hoursByPeriod == {night: 0, morning: 1, daytime: 1, evening: 2}
              )'

          cleanup
          trap - EXIT
