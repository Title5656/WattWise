name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: wattwise-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error

  deploy:
    name: Deploy main to WattWise Workers
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.MULTI_USER_CUTOVER_COMPLETE == 'true'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download validated production build
        uses: actions/download-artifact@v8
        with:
          name: wattwise-dist-${{ github.sha }}
          path: dist

      - name: Configure production D1 binding
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID"
          jq --arg id "$D1_DATABASE_ID" \
            '.name = "wattwise" | .d1_databases[0].database_id = $id | .d1_databases[0].migrations_dir = "../../drizzle"' \
            dist/server/wrangler.json > "$RUNNER_TEMP/wrangler.json"
          mv "$RUNNER_TEMP/wrangler.json" dist/server/wrangler.json

      - name: Reconcile existing D1 migration history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute DB --remote --file scripts/d1-baseline.sql --config dist/server/wrangler.json

      - name: Apply pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations list DB --remote --config dist/server/wrangler.json
          npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json

      - name: Verify cutover is still current
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: npm run cutover:remote -- verify

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Smoke-test production catalog API
        env:
          PRODUCTION_URL: https://wattwise.title5656.workers.dev
        run: |
          response="$(curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "$PRODUCTION_URL/api/catalog?pageSize=1")"
          echo "$response" | jq -e 'has("items") and has("pagination") and (.items | length <= 1)'
